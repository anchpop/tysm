[package]
name = "tysm"
version = "0.20.0"
edition = "2021"
description = "Batteries-included Rust OpenAI Client"
license = "MIT"
homepage = "https://github.com/not-pizza/tysm"
repository = "https://github.com/not-pizza/tysm"
readme = "README.md"
keywords = [
    "openai",
    "chatgpt",
    "chat-completions",
    "structured-outputs",
    "schema",
]

[features]
default = ["dotenvy"]
# Send a batch's uncached requests as ordinary live calls when there are few
# enough of them (see `ChatClient::small_batch_threshold`). The Batch API costs
# half as much but pays a fixed overhead — uploading the request file, waiting
# for the queue — that dwarfs the saving on a handful of requests, and shows up
# most on retries, where nearly everything is already cached.
small-batch-optimization = []
# Never use the Batch API: every `batch_*` call sends its uncached requests as
# ordinary live calls (concurrently), returning the same per-item results. For
# when the Batch API is unavailable — an org whose batches all fail validation,
# say — and a build should finish at live prices rather than not at all.
no-batch = []

[dependencies]
dotenvy = { version = "0.15.0", optional = true }
futures = "0.3"
reqwest = { version = "0.11.20", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.107", features = ["preserve_order"] }
thiserror = "2.0.9"
tynm = "0.1.10"
lru = "0.12.5"
schemars = { version = "1.0.1", features = ["preserve_order"] }
tokio = { version = "1.21.2", features = ["fs"] }
tokio-util = { version = "0.7.10", features = ["codec"] }
url = "2.5.4"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }
zstd = "0.13.3"
log = "0.4.27"
itertools = "0.14.0"
dashmap = "6.1.0"
base64 = "0.22.1"
osmo = { git = "https://github.com/anchpop/osmo" }

[dev-dependencies]
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "full"] }
tokio-test = "0.4"
anyhow = "1"
tempfile = "3"

[[example]]
name = "chat-completions"
path = "examples/chat_completions.rs"

[[example]]
name = "embeddings"
path = "examples/embeddings.rs"

[[example]]
name = "files"
path = "examples/files.rs"

[[example]]
name = "batch-completions"
path = "examples/batch_completions.rs"

[[example]]
name = "batch-completions-low-level"
path = "examples/batch_completions_low_level.rs"
